          description: Pedidos activos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              examples:
                activos:
                  value:
                    - id: 4f6a2b1c-9d8e-4c7b-a3f2-1e0d5c6b7a89
                      restaurantId: rest-1
                      tableId: 9c4e1a27-8b3d-4f6a-b2e5-0d7c1f9a3e44
                      tableNumber: 3
                      clientId: 3b9e7c1d-2a4f-4e8b-9c6d-5f1a0b2e3d47
