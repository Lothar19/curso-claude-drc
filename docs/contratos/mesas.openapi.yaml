                    tableId: 9c4e1a27-8b3d-4f6a-b2e5-0d7c1f9a3e44
                    tableNumber: 3
                    clientId: 3b9e7c1d-2a4f-4e8b-9c6d-5f1a0b2e3d47
                    createdAt: '2026-10-22T12:05:00.000Z'
                    items:
                      - id: a1b2c3d4-0000-4000-8000-000000000003
                        dishId: dish-7
