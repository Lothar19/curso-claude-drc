  /orders/{orderId}/items/{itemId}/status:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Pedidos]
      operationId: updateOrderItemStatus
      summary: Cambiar el estado de un ítem (SIN CAMBIOS, se incluye como referencia)
      description: No cambia con la issue. Liberar la mesa **no** es automático al entregar los ítems.
      x-roles: [autenticado]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderItemStatus'
            examples:
              entregar:
                value:
                  status: entregado
      responses:
        '204':
          description: Estado actualizado (sin cuerpo).
        '400':
          description: "Pedido/ítem inexistente o estado inválido (`Order not found` o `Estado inválido: ...`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderErrorResponse'
              examples:
                noExiste:
                  value:
                    error: Order not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT firmado por la API (expira en 8 h). Payload: `{ id: string, role: 'admin' | 'manager' |
        'camarero' | 'cocinero' | 'cliente', restaurantId: string | null }`.

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Id del restaurante (p. ej. `rest-1`).
      schema:
        type: string
      example: rest-1
    TableId:
      name: id
      in: path
      required: true
      description: Id (UUID) de la mesa. No es el número de mesa.
      schema:
        type: string
      example: 0b8f3a52-6e1d-4c7a-8f2b-91d3e4a5b601

  responses:
    Unauthorized:
      description: Sin token, token mal formado o inválido (middleware `authenticate`). En `GET /orders/mine` también `Unauthorized` si el JWT no trae `id`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            sinToken:
              value:
                error: 'Unauthorized: No token provided'
            tokenInvalido:
              value:
                error: 'Unauthorized: Invalid token'
    Forbidden:
      description: El rol del JWT no está en `x-roles` (middleware `authorize`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthErrorResponse'
          examples:
            prohibido:
              value:
                error: 'Forbidden: Insufficient permissions'
    TableNotFound:
      description: La mesa no existe o no pertenece al restaurante de la ruta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            noExiste:
              value:
                error: TableNotFoundError
                message: Table not found
    DuplicatedTableNumber:
      description: Ya hay otra mesa con ese número en el restaurante.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            numeroDuplicado:
              value:
                error: DuplicatedTableNumberError
                message: Table number is already in use in this restaurant
    InternalError:
      description: Error no controlado (vía `errorHandler`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            interno:
              value:
                error: InternalServerError
                message: Something went wrong
    OrderInternalError:
      description: Error no controlado en `OrderController`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderErrorResponse'
          examples:
            interno:
              value:
                error: Internal Server Error

  schemas:
    TableStatus:
      type: string
      enum: [libre, ocupada, reservada]
      description: Estado de la mesa. En la entrada se normaliza con `trim()` + `toLowerCase()`.

    Table:
      type: object
      additionalProperties: false
      required: [id, number, description, capacity, status, restaurantId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          description: Número visible de la mesa, único por restaurante.
        description:
          type: [string, 'null']
          description: Texto libre (ubicación, notas). `null` si no hay.
        capacity:
          type: integer
          minimum: 1
          description: Número máximo de comensales.
        status:
          $ref: '#/components/schemas/TableStatus'
        restaurantId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTableRequest:
      type: object
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
          description: Entero JSON > 0. Único en el restaurante (409 si se repite).
        description:
          type: [string, 'null']
          description: Opcional. Vacío o ausente → `null`.
        capacity:
          type: integer
          minimum: 1
          description: Entero JSON > 0.
        status:
          $ref: '#/components/schemas/TableStatus'
          description: Opcional; por defecto `libre`.

    UpdateTableRequest:
      type: object
      description: Reemplazo completo de `number`, `description` y `capacity`; `status` opcional (si falta, se conserva).
      required: [number, capacity]
      properties:
        number:
          type: integer
          minimum: 1
        description:
          type: [string, 'null']
          description: Ausente → `null` (no se conserva el valor anterior).
        capacity:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TableStatus'
          description: Opcional; si falta se conserva el estado actual.

    ChangeTableStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TableStatus'

    OrderItemStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]

    OrderItem:
      type: object
      required: [id, dishId, quantity, notes, status]
      properties:
        id:
          type: string
          format: uuid
        dishId:
          type: string
        quantity:
          type: integer
          const: 1
          description: Siempre 1; las cantidades se expanden en varios ítems al crear el pedido.
        notes:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/OrderItemStatus'
        dishName:
          type: [string, 'null']
          description: Solo en lecturas (no en la respuesta de `POST /orders`).
        dishPrice:
          type: [number, 'null']
          description: Solo en lecturas (no en la respuesta de `POST /orders`).
        dishCategory:
          type: [string, 'null']
          enum: [entrante, principal, postre, bebida, null]
          description: Solo en lecturas (no en la respuesta de `POST /orders`).

    Order:
      type: object
      required: [id, restaurantId, tableId, tableNumber, clientId, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
        restaurantName:
          type: [string, 'null']
          description: Solo en `GET /orders/mine` y `GET /orders/{id}`.
        restaurantLogoUrl:
          type: [string, 'null']
          description: Solo en `GET /orders/mine` y `GET /orders/{id}`.
        tableId:
          type: [string, 'null']
          description: Id (UUID) de la mesa. En pedidos antiguos puede ser texto libre (p. ej. `'5'`).
        tableNumber:
          type: [integer, 'null']
          description: |
            **Nuevo.** Número de la mesa (`LEFT JOIN tables`). `null` si no hay mesa, si `tableId` es
            texto libre antiguo o si la mesa se borró. Presente en todas las respuestas de pedidos.
        clientId:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'

    CreateOrderRequest:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
        tableId:
          type: [string, 'null']
          description: |
            Id de una mesa del mismo restaurante en estado `ocupada`. Ausente, `null` o `""` → pedido sin mesa.
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
              quantity:
                type: integer
                minimum: 1
              notes:
                type: [string, 'null']

    ErrorResponse:
      type: object
      description: Formato del `errorHandler` (todas las rutas de mesas).
      required: [error, message]
      properties:
        error:
          type: string
          description: Nombre de la clase de error (p. ej. `TableNotAvailableError`). Es lo que deben comparar los frontends.
        message:
          type: string
          description: Mensaje en inglés, informativo.

    OrderErrorResponse:
      type: object
      description: Formato de `OrderController` (rutas de pedidos). `error` contiene el **mensaje**, no el nombre de la clase.
      required: [error]
      properties:
        error:
          type: string

    AuthErrorResponse:
      type: object
      description: Formato de los middlewares `authenticate` (401) y `authorize` (403).
      required: [error]
      properties:
        error:
          type: string
